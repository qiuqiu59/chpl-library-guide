services:
  - type: web
    name: chpl-library-guide
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT server:app
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CREATOR_PIN
        value: 1357
